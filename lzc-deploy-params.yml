params:
    - id: web_key
      type: string
      name: "Web Key"
      description: "Key for the browser console: open https://<your-domain>/?k=<this key> once and it is remembered as a cookie. The launcher entry already carries it."
      default_value: "sk-magpie-lazycat-web"

locales:
    zh:
        web_key:
            name: "控制台 Web Key"
            description: "打开网页控制台所需的密钥：访问 https://你的域名/?k=该密钥 一次即可（会写入 Cookie，之后直接访问域名）。启动器里的「Magpie 控制台」入口已带此 Key，改这里后入口会自动跟随。"

    zh_CN:
        web_key:
            name: "控制台 Web Key"
            description: "打开网页控制台所需的密钥：访问 https://你的域名/?k=该密钥 一次即可（会写入 Cookie，之后直接访问域名）。启动器里的「Magpie 控制台」入口已带此 Key，改这里后入口会自动跟随。"

    en:
        web_key:
            name: "Web Key"
            description: "Key for the browser console: open https://<your-domain>/?k=<this key> once and it is remembered as a cookie. The launcher entry carries it already."
