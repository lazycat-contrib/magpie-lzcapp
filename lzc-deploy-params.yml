params:
    - id: web_key
      type: string
      name: "Web Key"
      description: "Key for the browser console (16+ chars, letters/digits/ - . _ ~). You normally never type it: the server injects it when you open the app domain, and a cookie remembers it; you can also open https://<your-domain>/?k=<this key> manually."
      default_value: "sk-magpie-lazycat-web"

locales:
    zh:
        web_key:
            name: "控制台 Web Key"
            description: "控制台的访问密钥（至少 16 个字符，只能用字母、数字与 - . _ ~）。正常不用记：打开应用域名时服务端会自动带上它（inject 按当前值注入），带一次后写入 Cookie；需要手动登录时可访问 https://你的域名/?k=该密钥。"

    zh_CN:
        web_key:
            name: "控制台 Web Key"
            description: "控制台的访问密钥（至少 16 个字符，只能用字母、数字与 - . _ ~）。正常不用记：打开应用域名时服务端会自动带上它（inject 按当前值注入），带一次后写入 Cookie；需要手动登录时可访问 https://你的域名/?k=该密钥。"

    en:
