application:
  subdomain: magpie
  multi_instance: false
  # 根路径给 Web 控制台(3430)；网关(3425)只放出 /v1、/v1beta 两个 API 前缀。
  # 网关的 OpenAI(/v1/chat/completions、/v1/responses)、Anthropic(/v1/messages)、
  # Gemini(/v1beta/...) 全部落在这两个前缀下，根路径不能给网关（会被控制台占用）。
  #
  # ⚠ 路径必须带尾斜杠：rail 的 location 不带尾斜杠时只匹配精确路径
  # （/v1 能进网关，/v1/models 会掉回 / 落到控制台，表现为 401）。
  # 带上尾斜杠才是「目录前缀」匹配，/v1/models 这类子路径才会转发到网关。
  upstreams:
    - location: /v1/
      backend: http://magpie:3425
      disable_trim_location: true
    - location: /v1beta/
      backend: http://magpie:3425
      disable_trim_location: true
    - location: /
      backend: http://magpie:3430
  # / 与 /v1* 都关闭微服账号密码鉴权：控制台用自己的 Web Key，网关用共享 Key，
  # 手机 / agent / CLI 不必先过微服登录。
  public_path:
    - /
  entries:
    # 启动器入口不渲染模板参数（写 {{ .U.web_key }} 会原样带出去），所以入口只打开根路径；
    # 下面 console-key 的 inject 会在响应阶段把未带 Key 的 401 改写成带 Key 的跳转。
    - id: console
      title: "Magpie 控制台"
      path: /
  injects:
    # 浏览器不带 Key 打开 / 时 magpie 回 401「open the link magpie web printed」，
    # 在响应阶段把它改写成 303 跳转到 ?k=<Web Key>，点开应用即无感进入控制台。
    # 脚本出错只记日志、原样放过。
    - id: console-key
      on: response
      auth_required: false
      when:
        - /
      do:
        - src: |
            try {
              if (ctx.status === 401 && ctx.params && ctx.params.key) {
                ctx.response.send(303, "", { location: "/?k=" + encodeURIComponent(ctx.params.key) });
              }
            } catch (e) { console.log("console-key inject:", e); }
          params:
            key: "{{ .U.web_key }}"
services:
  magpie:
    user: root
    # upstream: ghcr.io/yetone/magpie:0.1.1151
    # 官方商店交付（delivery.mode=lazycat）时由 Action 转存为
    # registry.lazycat.cloud/czyt/yetone/magpie:<hash> 并改写此行
    image: registry.lazycat.cloud/czyt/yetone/magpie:b6742662666ff40b
    # 镜像默认 CMD 是 serve（只跑网关）；web 会同时把网关起在旁边并监听 3430。
    # distroless 镜像没有 shell，command 必须以 exec 形式追加到 ENTRYPOINT /magpie 之后。
    command: web --addr 0.0.0.0:3430 --no-open
    environment:
      # 控制台访问密钥，固定下来（否则每次重启都会换 Key）
      - MAGPIE_WEB_KEY={{ .U.web_key }}
      # 网关监听地址不覆盖，用镜像默认的 0.0.0.0:3425：微服入口要把 /v1、/v1beta 转发进来。
      # 未在控制台打开「Share on local network」前，网关按上游设计对外接受任意 Key，
      # 所以安装后请尽快在控制台开启共享（见 usage）。
      # 容器里 magpie 只看得到容器自己的地址，用这个把对外的 base URL 告诉它：
      # 控制台「网关」页显示的、CLI 打印的、写进 agent 配置的都是它。
      - MAGPIE_PUBLIC_URL=https://{{ .S.AppDomain }}
    healthcheck:
      # 镜像自带的健康检查（distroless 里没有 curl，也不需要）
      test:
        - CMD
        - /magpie
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    binds:
      - /lzcapp/var/config:/config
usage: |
  Magpie 把各家模型接到一处，给 Codex / Claude Code / OpenCode 等 agent 提供统一网关（OpenAI / Anthropic / Gemini 兼容）。

  【打开控制台】
  直接点启动器入口或打开应用域名即可（服务端会自动跳到带 Key 的地址）；也可以手动访问：
      https://你的域名/?k=<Web Key>
  Web Key 在安装向导里填写（默认 sk-magpie-lazycat-web；至少 16 个字符，只能用字母、数字与 - . _ ~）。带 Key 打开一次后会写入 Cookie，之后裸域名即可。
  注意：控制台只由这个 Web Key 保护（本应用已关闭微服账号鉴权），默认值在开源仓库里可见，建议在安装向导里改成只有你知道的 Key。

  【让外部 agent 用上网关】
  本应用已把对外地址设成应用域名，控制台「网关」页里显示的 base URL 可直接复制使用
  （OpenAI 兼容：https://你的域名/v1；Anthropic / Gemini：https://你的域名）。
  1. 先打开控制台，进入 Settings → Share on local network，打开局域网共享，它会生成一个 sk-magpie-… 的 Key；
  2. 把 agent 指向应用域名，API Key 填上面那个共享 Key：
       OpenAI 兼容：base_url = https://你的域名/v1
       Anthropic：  base_url = https://你的域名
       Gemini：     base_url = https://你的域名
  注意：打开共享之前，网关对能访问到本应用域名的人一律放行（任意 Key 都行，这是上游的默认行为），
  请安装后先完成第 1 步。打开共享后，请求必须携带上面那个共享 Key，带错 Key 会被拒绝。

  【订阅登录】
  在容器里发起 Claude / ChatGPT 这类订阅登录时，浏览器最后会跳回 localhost（你自己的机器），那个页面打不开：
  把地址栏里整条地址复制出来，粘进登录流程的 Callback URL 输入框即可。
  （也可以 docker exec 进容器跑 /magpie accounts add codex，效果一样。）

  【数据】
  镜像把东西都放在 /config：magpie 自己的文件、登录态（HOME 也在里面）和插件缓存，
  本应用把它持久化在 /lzcapp/var/config，升级/重装不丢；需要迁移或备份时整目录拷走即可。
