application:
  subdomain: magpie
  multi_instance: false
  # 根路径给 Web 控制台(3430)；网关(3425)只放出 /v1、/v1beta 两个 API 前缀。
  # 网关的 OpenAI(/v1/chat/completions、/v1/responses)、Anthropic(/v1/messages)、
  # Gemini(/v1beta/...) 全部落在这两个前缀下，根路径不能给网关（会被控制台占用）。
  upstreams:
    - location: /v1
      backend: http://magpie:3425
      disable_trim_location: true
    - location: /v1beta
      backend: http://magpie:3425
      disable_trim_location: true
    - location: /
      backend: http://magpie:3430/
  # 整个应用关闭微服账号密码鉴权：控制台由 Web Key 把门（客户端打开时 inject 自动带上，
  # 其他入口用 /?k=<Web Key>），网关由控制台的「Share on local network」共享 Key 把门，
  # agent / CLI / 手机都不必先过微服登录。
  public_path:
    - /
  entries:
    # 入口带一个空的 k=：平台/启动器对纯 / 的入口不友好，而空 k 本身进不去
    # （magpie 会当成「k 值不对」直接 401），所以由下面的 inject 把它换成真实的 web_key
    - id: console
      title: "Magpie 控制台"
      path: "/?k="
  injects:
    # magpie 控制台有自己的 Key 墙：要 /?k=<Web Key>（它与 Cookie magpie_web_<端口> 互换）。
    # 请求阶段补一次：请求 / 时若 k 为空（入口带的就是空 k）或没带 k、且还没有 Cookie，
    # 303 到 /?k=<向导里的 web_key>，用户设置的 Key 改什么都对得上；其他 query 参数保留。
    # 只拦页面路径 /，/api/*、/v1* 与静态资源都不碰。
    # 注：ctx 只在懒猫客户端链路上生效；其他入口请手动 https://域名/?k=<Web Key>。
    - id: console-web-key
      on: request
      auth_required: false
      when:
        - /
      do:
        - src: |
            try {
              var key = ctx.params && ctx.params.key;
              var q = ctx.request.raw_query || "";
              var cookie = ctx.headers.get("Cookie") || "";
              var parts = q ? q.split("&") : [];
              var hasKey = false;
              var keep = [];
              for (var i = 0; i < parts.length; i++) {
                var p = parts[i];
                if (p.indexOf("k=") === 0) {
                  // 入口带的是空的 k=，只有非空才是真的带上 Key
                  if (p.length > 2) { hasKey = true; }
                } else if (p) {
                  keep.push(p);
                }
              }
              if (key && !hasKey && cookie.indexOf("magpie_web_3430=") === -1) {
                var loc = "/?" + (keep.length ? keep.join("&") + "&" : "") + "k=" + key;
                ctx.response.send(303, "", { location: loc });
              }
            } catch (e) { console.log("console-web-key inject:", e); }
          params:
            key: "{{ .U.web_key }}"
services:
  magpie:
    user: root
    # upstream: ghcr.io/yetone/magpie:0.1.503
    # 官方商店交付（delivery.mode=lazycat）时由 Action 转存为
    # registry.lazycat.cloud/czyt/yetone/magpie:<hash> 并改写此行
    image: registry.lazycat.cloud/czyt/yetone/magpie:5f2f8b8d92f9e387
    # 镜像默认 CMD 是 serve（只跑网关）；web 会同时把网关起在旁边并监听 3430。
    # distroless 镜像没有 shell，command 必须以 exec 形式追加到 ENTRYPOINT /magpie 之后。
    command: web --addr 0.0.0.0:3430 --no-open
    environment:
      # 控制台访问密钥，固定下来（否则每次重启都会换 Key）
      - MAGPIE_WEB_KEY={{ .U.web_key }}
      # 网关监听地址不覆盖，用镜像默认的 0.0.0.0:3425：微服入口要把 /v1、/v1beta 转发进来。
      # 未在控制台打开「Share on local network」前，网关按上游设计对外接受任意 Key，
      # 所以安装后请尽快在控制台开启共享（见 usage）。
    binds:
      - /lzcapp/var/config:/config
usage: |
  Magpie 把各家模型接到一处，给 Codex / Claude Code / OpenCode 等 agent 提供统一网关（OpenAI / Anthropic / Gemini 兼容）。

  【打开控制台】
  · 懒猫客户端里点启动器入口即可：服务端会把访问密钥注入到地址里，打开即进；
  · 用其他浏览器或工具打开时，手动访问：https://你的域名/?k=<Web Key>
  Web Key 在安装向导里填写（默认 sk-magpie-lazycat-web；至少 16 个字符，只能用字母、数字与 - . _ ~）。
  带 Key 打开一次后会写入 Cookie（有效期 400 天），之后裸域名也能进。控制台仍在微服账号鉴权之后。

  【让外部 agent 用上网关】
  1. 先打开控制台，进入 Settings → Share on local network，打开局域网共享，它会生成一个 sk-magpie-… 的 Key；
  2. 把 agent 指向应用域名，API Key 填上面那个共享 Key：
       OpenAI 兼容：base_url = https://你的域名/v1
       Anthropic：  base_url = https://你的域名
       Gemini：     base_url = https://你的域名
  注意：打开共享之前，网关对能访问到本应用域名的人一律放行（任意 Key 都行，这是上游的默认行为），
  请安装后先完成第 1 步。打开共享后，请求必须携带上面那个共享 Key，带错 Key 会被拒绝。

  【数据】
  账号、API Key、登录态都持久化在 /lzcapp/var/config（容器内 /config），应用升级不丢；需要迁移或备份时整目录拷走即可。
