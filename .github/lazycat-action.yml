version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: build/magpie.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: magpie

build:
  toolchains: []
  run_buildscript: false

images:
  - id: magpie
    target: service
    service: magpie
    source: ghcr.io/yetone/magpie
    channel: stable
    # 上游只发 0.1.x 形式的 tag（无 v 前缀），排除 sha256-* 与 latest
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      # 官方商店要求镜像来自懒猫镜像源：由 Action 用 LZC_API_TOKEN 转存并改写 manifest
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: Magpie
      brief: 把各家大模型接到一处，给 Codex、Claude Code 等 Agent 一个统一的模型网关
      description: |
        Magpie 让 Codex、Claude Code、OpenCode、Cursor、Gemini CLI 等 Agent 共用一份模型配置：
        在一个网页控制台里添加供应商或登录订阅账号，Agent 侧只改一行 Base URL，就能互相切换、
        共享同一个模型目录。网关同时兼容 OpenAI（Chat Completions / Responses）、Anthropic 与
        Gemini 三种 API，流式输出、工具调用与思考过程都会原样翻译过去；控制台还能查看每次请求
        的路由过程、用量与供应商健康度。数据（账号、密钥、登录态）都留在你自己的懒猫微服里。
      keywords: AI 网关,模型网关,Codex,Claude Code,OpenCode,OpenAI,Anthropic,Gemini
      source: https://github.com/yetone/magpie
      source_author: yetone
      support_pc: true
      screenshot_pc_files:
        - .github/screenshots/pc-1-gateway.png
        - .github/screenshots/pc-2-providers.png
        - .github/screenshots/pc-3-routing.png
  private:
    enabled: true
    skip_if_version_exists: true
    name: Magpie
    summary: "Magpie 懒猫微服打包：统一模型网关 + 网页控制台（OpenAI / Anthropic / Gemini 兼容）。"
